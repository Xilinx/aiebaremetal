CONFIG_STATIC_INIT_GNU=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_NEWLIB_LIBC=y
CONFIG_CPP_RTTI=y
CONFIG_PICOLIBC=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_POSIX_FD_MGMT=y
CONFIG_POSIX_FILE_SYSTEM=y
CONFIG_POSIX_SYSTEM_INTERFACES=y

# ResNet18 demo serves inferences over TCP (netprocess.h); keep the IPv4/sockets
# stack on like the baremetal lwIP path.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Interactive console menu reads keystrokes from the chosen zephyr,console UART
# (std::cin EOF-spins here). RX is interrupt-driven: uart_rx_fixup.c registers a
# callback that drains bytes into a queue read by abr_console_rx_getc(). This
# needs the GICv3 ARE_S fix (done locally in uart_rx_fixup.c) so the UART SPI
# reaches the A72 at EL3.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Size optimization (-Os), matching the baremetal host build (compile.sh -Os)
# for an apples-to-apples baremetal-vs-Zephyr comparison.
CONFIG_SIZE_OPTIMIZATIONS=y

# NB: the AIE register aperture is mapped at runtime by the aiebaremetal library
# (abr_map_aie_aperture) instead of a static SoC MMU-table entry. The kernel VM
# window sizing / 48-bit VA-PA needed for that 2 TiB aperture live in the
# board fragment boards/versal_apu.conf (merged after this file).

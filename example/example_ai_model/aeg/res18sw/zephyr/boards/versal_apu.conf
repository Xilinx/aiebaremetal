# Default 16 KB malloc arena is too small for aie-rt FAL + resnet18 AIE DDR
# buffers (~13 MiB wts+ifm+ofm). 67108864 = 64 MiB (decimal; hex rejected).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=67108864

# 48-bit VA/PA to reach the AIE aperture at 0x20000000000 (2^41).
CONFIG_ARM64_VA_BITS_48=y
CONFIG_ARM64_PA_BITS_48=y

# VM window for kernel + device MMIO maps (UART). AIE aperture is direct-mapped
# at its 2 TiB base, outside this window, so 256 MB suffices.
CONFIG_KERNEL_VM_SIZE=0x10000000

# Direct (VA==phys) map for the AIE aperture (avoids the dynamic-VA -EBUSY
# collision with identity-mapped DDR/peripherals; uses 1 GiB blocks).
CONFIG_KERNEL_DIRECT_MAP=y
CONFIG_MAX_XLAT_TABLES=24

# Keep board default TFA on (bl31 @EL3 -> Zephyr; bundled into the .BIN).
